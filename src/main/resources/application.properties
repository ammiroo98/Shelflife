spring.application.name=shelflife

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shelflife}
spring.datasource.username=${DB_USERNAME:shelflife}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

shelflife.lending.max-active-loans=2
shelflife.lending.loan-duration-days=14
